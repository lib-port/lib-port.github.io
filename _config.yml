exclude:
  - README.md
  - preview.sh
  - requirements.txt
  - scripts/
  - tests/
  - LICENSE
  - package.json
  - package-lock.json
  - node_modules/

plugins:
  - jekyll-gfm-admonitions
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-octicons
  - jekyll-github-metadata

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed
  sourcemap: development

remote_theme: jekyll/minima

minima:
  skin: auto
  show_excerpts: true
  hide_site_feed_link: true

title: Library + Portfolio

##################################
# Start of landing page settings
##################################

find_the_bug_game:
  switch: true

light_dark_ball:
  switch: true

github_icon:
  switch: true
  link: repos # {profile|repos}
  style: auto # {auto|text|icon}

paper_plane:
  switch: true

intro:
  switch: false
  text: Course notes and projects

# ASCII art by github.com/bas3line
ascii_banner:
  switch: false
  module: random

repo_grid:
  switch: true
  repo_list:
    - tech-lib
    - lib-port.github.io
    - who-gets-heard
    - full-stack-pm
    - open-banking-lakehouse
    - backtest
    - pricing-function-mapper
    - papers

recent_milestones:
  switch: true
  repo_list:
    - tech-lib
    - who-gets-heard
    - full-stack-pm
  milestones: 1

recent_commits:
  switch: true
  commits: 10

external_blog:
  switch: false
  feed_url:
  archive_url:
  post_limit: 7

################################
# End of landing page settings
################################

description:
