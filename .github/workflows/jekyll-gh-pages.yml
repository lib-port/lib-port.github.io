# Sample workflow for building and deploying a Jekyll site to GitHub Pages with dependencies preinstalled
name: Deploy Jekyll with GitHub Pages 

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "tests/**"
      - ".github/workflows/mirror-gitlab.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment and cancel it when a newer revision is ready to publish.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Cache Ruby gems + build with Jekyll directly (faster than reinstalling gems each run)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate config
        run: python3 scripts/validate_site_config.py

      - name: Build site
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.PINNED_REPOS_GITHUB_TOKEN != '' && secrets.PINNED_REPOS_GITHUB_TOKEN || github.token }}
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build -d ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
